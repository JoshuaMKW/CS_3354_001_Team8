<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your Cramberry account</title>
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <main class="page">
    <div class="card">
      <h1 class="brand">Cramberry</h1>
      <p class="tagline">Make school feel a little more manageable.</p>
      <h2 class="title">Create your account</h2>

      <form id="auth-form" class="form" data-endpoint="/api/signup" data-busy="Creating account..." novalidate>
        <label class="label">Email address
          <input class="input" name="email" type="email" autocomplete="email" required>
        </label>
        <label class="label">Username
          <input class="input" name="username" type="text" autocomplete="username" minlength="3" maxlength="30" required>
        </label>
        <label class="label">Password
          <input class="input" name="password" type="password" autocomplete="new-password" minlength="8" required>
          <span class="hint">At least 8 characters, with a number and a special character.</span>
        </label>
        <p id="form-error" class="error" role="alert" hidden></p>
        <button class="button" type="submit">Sign up</button>
      </form>

      <p class="footer">Already have an account? <a class="link" href="/Login.html">Sign in</a></p>
    </div>
  </main>
  <script src="/auth.js" defer></script>
</body>
</html>
