<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in to Cramberry</title>
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <main class="page">
    <div class="card">
      <h1 class="brand">Cramberry</h1>
      <p class="tagline">Your student AI schedule planner</p>
      <h2 class="title">Sign in</h2>

      <form id="auth-form" class="form" data-endpoint="/api/login" data-busy="Signing in..." novalidate>
        <label class="label">Email address
          <input class="input" name="email" type="email" autocomplete="email" required>
        </label>
        <label class="label">Password
          <input class="input" name="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="form-error" class="error" role="alert" hidden></p>
        <button class="button" type="submit">Sign in</button>
      </form>

      <p class="footer">No account yet? <a class="link" href="/Signup.html">Sign up</a></p>
    </div>
  </main>
  <script src="/auth.js" defer></script>
</body>
</html>
