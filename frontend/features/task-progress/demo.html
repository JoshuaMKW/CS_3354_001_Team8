<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cramberry — Task progress demo</title>
<link rel="stylesheet" href="./task-progress.css">
<style>body{margin:0;background:#f1f5ef;color:#203327;font:1rem/1.5 system-ui,sans-serif;padding:1rem}main{max-width:65rem;margin:auto}</style>
<main><h1>Cramberry</h1><p>This demo creates a disposable account and sample tasks in the local development database.</p><button id="setup">Load sample tasks</button><p id="message" role="status"></p><div id="panel"></div></main>
<script type="module">
import { createTaskApi } from './api.mjs';
import { mountTaskProgress } from './task-progress.mjs';
const baseUrl = 'http://127.0.0.1:8080';
const button = document.querySelector('#setup');
const message = document.querySelector('#message');
let cleanup;
async function post(path, body, token) {
  const response = await fetch(baseUrl + path, { method:'POST', headers:{'Content-Type':'application/json', ...(token ? {Authorization:`Bearer ${token}`} : {})}, body:JSON.stringify(body) });
  const result = await response.json();
  if (!response.ok) throw new Error(result.error || 'Setup failed');
  return result;
}
button.addEventListener('click', async () => {
  button.disabled = true; message.textContent = 'Creating local sample data…';
  try {
    const suffix = crypto.randomUUID();
    const { token } = await post('/api/auth/register', {name:'RM Demo',email:`rm-${suffix}@example.com`,password:`Demo-${suffix}1`});
    const course = await post('/api/courses',{name:'Software Engineering',code:'CS 3354'},token);
    const now = Date.now();
    for (const [title, delta, status] of [['Project report',-3600000,'NOT_STARTED'],['Review notes',0,'COMPLETED'],['Final presentation',3600000,'IN_PROGRESS']]) {
      await post('/api/tasks',{title,courseId:course.id,dueAt:new Date(now+delta).toISOString().replace(/\.\d{3}Z$/,'Z'),status},token);
    }
    cleanup?.(); cleanup = mountTaskProgress(document.querySelector('#panel'),createTaskApi({baseUrl,getToken:()=>token}));
    message.textContent = 'Local sample data ready.';
  } catch (error) { message.textContent = error.message; button.disabled = false; }
});
</script>
</html>
